[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-assistant"
version = "0.1.0"
description = "Personal portfolio project: a multi-agent RAG assistant (FastAPI + LangGraph + FAISS)."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "langgraph==1.2.18",
    "langchain-core==1.7.1",
    "langchain-text-splitters==1.1.3",
    "faiss-cpu==1.15.1",
    "numpy==2.5.4",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
